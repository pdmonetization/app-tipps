backend:
  name: github
  repo: pdmonetization/app-tipps
  branch: main
  auth_methods: [token]

media_folder: "public/images/uploads"
public_folder: "/images/uploads"
site_url: https://app-tipps.com
display_url: https://app-tipps.com

collections:
  - name: posts
    label: Articles
    label_singular: Article
    folder: src/content/posts
    create: true
    slug: "{{fields.slug}}"
    identifier_field: title
    sortable_fields: [publishDate, title]
    preview_path: "{{fields.slug}}"
    fields:
      - { name: title, label: Headline, widget: string, hint: "Use a clear descriptive headline." }
      - { name: slug, label: URL slug, widget: string, pattern: ['^[a-z0-9-]+$', 'Lowercase letters, numbers and hyphens only'], hint: "Example: balatro-mobile-beginners-guide. Do not change after publishing." }
      - { name: description, label: Summary / meta description, widget: text, pattern: ['^.{50,165}$', 'Between 50 and 165 characters'] }
      - { name: publishDate, label: Published date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { name: updatedDate, label: Last updated, widget: datetime, required: false, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - name: author
        label: Byline
        widget: select
        default: "App-Tipps Editorial"
        options: ["App-Tipps Editorial", "Sylvie Fox", "Olivia Williams", "Amelia Thomas", "Daniel Clark", "Andrew Wright", "Sophia Garcia", "Michael Wilson", "Alexander Davis", "James Smith", "Mia Martinez"]
      - name: category
        label: Category
        widget: select
        options: ["Game Review", "App Review", "Game Guide", "App Tips", "Comparison", "News", "AT's Best Picks", "Redeem Codes"]
      - { name: categories, label: Extra categories, widget: list, required: false }
      - { name: tags, label: Tags, widget: list, required: false, hint: "Examples: Android, iOS, Balatro, Card Games" }
      - { name: featuredImage, label: Featured image, widget: image, required: false, hint: "Upload an image here if the article has one." }
      - { name: featuredImageAlt, label: Image alt text, widget: string, required: false, hint: "Describe what is visible in the image." }
      - { name: rating, label: Review score out of 5, widget: number, required: false, value_type: float, min: 1, max: 5, step: 0.1 }
      - { name: seoTitle, label: Custom Google title, widget: string, required: false }
      - { name: canonicalUrl, label: Canonical URL override, widget: string, required: false }
      - { name: noindex, label: Hide from Google, widget: boolean, default: false }
      - { name: draft, label: Draft, widget: boolean, default: false }
      - { name: body, label: Article, widget: markdown }
